# Synthetic UI layout; fixed sizing supports real-window pointer checks.
# Includes conditional, command, custom-button and cycle controls without external plugins.
timeline_size=30
controls=menu,open-file,<idle>command:history:script-message fixture-history?Fixture history,<idle>command:bookmarks:script-message fixture-bookmarks?Fixture bookmarks,<!idle>command:analytics:show-text Fixture?Fixture notice,<stream,!has_playlist>stream-quality?Stream quality,<audio,image>command:image:script-binding uosc/video#video?Artwork,<has_many_edition>editions,<has_audio+!audio>audio,<video,audio>subtitles,<has_chapter>chapters,<has_playlist>space,space,<!idle,!image>command:fast_rewind :seek -5 exact?Back 5s,<video,audio>speed,<!idle,!image>command:fast_forward:seek  5 exact?Forward 5s,space,<video>button:fixture-action,<video>cycle:toggle_on:mute:yes=toggle_on/no=toggle_off?Toggle mute,command:palette:script-message fixture-style-menu?Fixture action,gap,gap,<has_playlist>prev,<has_playlist>playlist,<has_playlist>next,gap,audio-device,gap,fullscreen
